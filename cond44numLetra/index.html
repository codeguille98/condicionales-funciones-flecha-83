<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeros Escritos</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
</head>


<body class="min-h-screen bg-blue-100 flex items-center justify-center">

  <div class="bg-white shadow-2xl rounded-3xl p-8 w-[380px]">

    <h1 class="text-2xl font-bold text-blue-950 text-center mb-6">
      Escritura de números
    </h1>

    <div class="flex flex-col gap-4">

      <label class="text-sm font-medium text-gray-700">
        Introduce un número
        <input 
          id="numero" 
          type="number"
          class="mt-1 w-full p-2 rounded-lg border border-gray-300 
                 focus:outline-none focus:ring-2 focus:ring-blue-900"
        >
      </label>

      <button 
        onclick="transforma()" 
        type="button"
        class="py-3 bg-blue-950 text-white rounded-xl font-semibold 
               hover:bg-blue-800 active:scale-95 transition-all duration-200 shadow-md">
        Transforma
      </button>

      <div class="p-4 bg-blue-50 border border-blue-200 rounded-xl text-center">
        <p id="numLetra" class="text-blue-950 font-medium"></p>
      </div>

    </div>

  </div>

    <script>
      const NUMERO = document.getElementById("numero");
      const RES_NUM_LETRA = document.getElementById("numLetra");


      const numEscrito = [
          "cero",
          "uno",
          "dos",
          "tres",
          "cuatro",
          "cinco",
          "seis",
          "siete",
          "ocho",
          "nueve",
          "diez",

      ];


      const  transforma = () => {

          let numero = Number(NUMERO.value);

          if (numero >= 0 && numero <= 10) {
            RES_NUM_LETRA.innerHTML = `El numero ${numero} se escribe como "${numEscrito[numero]}"`
            
          } else{
              RES_NUM_LETRA.innerHTML = `El numero ${numero} no està entre el 0 y el 10`
              
          }

      }


    </script>
</body>
</html>
