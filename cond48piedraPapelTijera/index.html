<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, Papel o Tijera</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
</head>

<body class="min-h-screen bg-blue-100 flex items-center justify-center">

  <div class="bg-white shadow-2xl rounded-3xl p-8 w-[380px]">

    <h1 class="text-2xl font-bold text-blue-950 text-center mb-6">
      Juega a Piedra, Papel o Tijera
    </h1>

    <div class="flex flex-col gap-4">

      
      <label class="text-sm font-medium text-gray-700">
        Tu elección (1 piedra, 2 papel, 3 tijera)
        <input 
          id="usuario" 
          type="number"
          min="1" max="3"
          class="mt-1 w-full p-2 rounded-lg border border-gray-300 
                 focus:outline-none focus:ring-2 focus:ring-blue-900"
        >
      </label>

      
      <button 
        onclick="jugar()" 
        type="button"
        class="py-3 bg-blue-950 text-white rounded-xl font-semibold 
               hover:bg-blue-800 active:scale-95 transition-all duration-200 shadow-md">
        Jugar
      </button>

      
      <div class="p-4 bg-blue-50 border border-blue-200 rounded-xl text-center">
        <p id="resultado" class="text-blue-950 font-medium"></p>
      </div>

    </div>

  </div>

    <script>
      const RESULTADO = document.getElementById("resultado");
      const USUARIO = document.getElementById("usuario");

      const jugar = () => {

          let opciones = ["piedra", "papel", "tijera"];

          let user = parseInt(USUARIO.value);
          let cpu = Math.floor(Math.random() * 3) + 1;

          
          if (user < 1 || user > 3 || isNaN(user)) {
              RESULTADO.innerHTML = "Entiendo que no quieres jugar. Adiós";
              return;
          }

          let usuarioTexto = opciones[user - 1];
          let cpuTexto = opciones[cpu - 1];

        
          if (user === cpu) {
              RESULTADO.innerHTML = `Yo ${cpuTexto} y tú ${usuarioTexto}. ¡Empate!`;
              return;
          }

          
          let ganaUsuario =
              (user === 1 && cpu === 3) || 
              (user === 2 && cpu === 1) || 
              (user === 3 && cpu === 2);   

          if (ganaUsuario) {
              RESULTADO.innerHTML = `Yo ${cpuTexto} y tú ${usuarioTexto}. ¡Has ganado! 🎉`;
          } else {
              RESULTADO.innerHTML = `Yo ${cpuTexto} y tú ${usuarioTexto}. ¡He ganado! 😎`;
          }
      }



    </script>
</body>
</html>
