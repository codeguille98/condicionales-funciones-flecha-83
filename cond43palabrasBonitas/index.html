<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palabras Bonitas</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
</head>


<body class="min-h-screen bg-blue-100 flex items-center justify-center">

  <div class="bg-white shadow-2xl rounded-3xl p-8 w-[380px]">

    <h1 class="text-2xl font-bold text-blue-950 text-center mb-6">
      Comprobador de Palabras Bonitas
    </h1>

    <div class="flex flex-col gap-4">

      <label class="text-sm font-medium text-gray-700">
        Introduce la palabra
        <input 
          id="palabra" 
          type="text"
          class="mt-1 w-full p-2 rounded-lg border border-gray-300 
                 focus:outline-none focus:ring-2 focus:ring-blue-900"
        >
      </label>

      <button 
        onclick="comprueba()" 
        type="button"
        class="py-3 bg-blue-950 text-white rounded-xl font-semibold 
               hover:bg-blue-800 active:scale-95 transition-all duration-200 shadow-md">
        Comprobar
      </button>

      <div class="p-4 bg-blue-50 border border-blue-200 rounded-xl text-center">
        <p id="resComprobacion" class="text-blue-950 font-medium"></p>
      </div>

    </div>

  </div>


    <script>
      const PALABRA = document.getElementById("palabra");
      const RES_COMPROBACION = document.getElementById("resComprobacion");

      const comprueba = () => {

          let palabra = PALABRA.value.toLowerCase(); 

          let esBonita =
              (palabra.length == 9 && palabra[0] == "h") ||
              (palabra.length == 5 && palabra[0] == "p");

          if (esBonita) {
              RES_COMPROBACION.innerHTML = `"${PALABRA.value}" es una palabra bonita`;
          } else {
              RES_COMPROBACION.innerHTML = `"${PALABRA.value}" no es una palabra bonita`;
          }
      }


    </script>
</body>
</html>
